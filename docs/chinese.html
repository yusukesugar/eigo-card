<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="えいご">
<meta name="theme-color" content="#2f7fd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html { background: #2f7fd6; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
<title>中国語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --sky: #2f7fd6;
    --sky-deep: #1d5ea8;
    --card: #fff6cf;
    --card-edge: #e9c94a;
    --ink: #1c2b40;
    --sub: #5a6b82;
    --pop: #ff6b4a;
    --pop-deep: #c94a2f;
    --white: #ffffff;
    --en: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
    --ja: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: var(--ja);
    padding-inline: 16px;
    padding-block: 16px 32px;
  }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--white); }
  h1 { margin: 0; font-weight: 800; font-size: clamp(24px, 6vw, 34px); letter-spacing: .04em; }
  .home {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-right: 10px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--sky-deep);
    color: var(--white);
    font-size: 16px;
    font-weight: 800;
    text-decoration: none;
    vertical-align: middle;
  }
  .home:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
  .card:has(.cap), .choice:has(.cap) { align-content: center; gap: 4px; }
  .cap { display: block; font: 800 14px/1.2 var(--ja); color: var(--sub); padding-inline: 4px; }
  .cap.word { font-size: 17px; color: var(--ink); white-space: nowrap; }
  .hint { margin: 0; font-size: 15px; color: var(--white); }

  .modes { display: flex; background: var(--sky-deep); border-radius: 999px; padding: 4px; gap: 4px; }
  .mode {
    font: 800 15px var(--ja);
    color: var(--white);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
  }
  .mode[aria-checked="true"] { background: var(--white); color: var(--ink); }
  .mode:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }

  .big-pic.txt, .card.txt { font-family: var(--en); font-weight: 700; color: var(--ink); }
  .big-pic.txt { font-size: clamp(72px, 20vw, 110px); }
  .card.txt { font-size: max(24px, var(--txt)); }
  .big-word.hidden { color: var(--card-edge); letter-spacing: .15em; }

  .big-word.long { font-size: clamp(30px, 8.5vw, 50px); text-wrap: balance; }
  .slot { color: var(--pop); }
  .slot.masked { color: var(--card-edge); letter-spacing: .1em; }
  .pick-msg .en { overflow-wrap: anywhere; }

  .view { display: grid; justify-items: center; gap: 4px; width: 100%; }
  /* 選ぶの4まい: たてが短い画面では小さくして、下のボタンが切れないようにする */
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 360px; max-width: clamp(200px, calc(100dvh - 460px), 360px); }
  .choice {
    background: var(--card);
    border: 3px solid var(--card-edge);
    border-radius: 20px;
    aspect-ratio: 1;
    max-width: 100%;
    font-size: clamp(48px, 14vw, 72px);
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 0 5px 0 var(--card-edge);
    padding: 0;
  }
  .choice.txt { font-family: var(--en); font-weight: 700; color: var(--ink); font-size: clamp(34px, 10vw, 48px); }
  .choice:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  .choice.right { background: var(--white); border-color: #2eaa5c; box-shadow: 0 5px 0 #2eaa5c; }
  .choice.wrong { opacity: .35; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .pick-msg { margin: 8px 0 4px; min-height: 1.6em; font-size: 20px; font-weight: 800; text-align: center; }
  .pick-msg .en { font-family: var(--en); font-size: 26px; }
  .cards[hidden], .view[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { .choice.wrong { animation: none; } }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    font: 800 14px var(--ja);
    color: var(--white);
    background: var(--sky-deep);
    border: 0;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab[aria-selected="true"] { background: var(--white); color: var(--ink); }
  .tab .num { font-family: var(--en); margin-right: 4px; opacity: .7; }

  .stage {
    background: var(--white);
    border-radius: 28px;
    padding: 18px 16px 20px;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 4px;
    box-shadow: 0 8px 0 var(--sky-deep);
    min-height: 230px;
    text-align: center;
  }
  .big-pic { font-size: clamp(80px, 22vw, 120px); line-height: 1.1; }
  .big-word { font-family: var(--en); font-weight: 700; font-size: clamp(42px, 12vw, 70px); line-height: 1.05; letter-spacing: .02em; overflow-wrap: anywhere; }
  .big-ja { font-size: 18px; color: var(--sub); }
  .ja-row { display: flex; align-items: center; gap: 8px; }
  .info {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--sky);
    background: var(--white);
    color: var(--sky);
    font: 700 16px/1 var(--en);
    cursor: pointer;
    padding: 0;
  }
  .info[aria-expanded="true"] { background: var(--sky); color: var(--white); }
  .info:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .note {
    margin: 6px 0 2px;
    max-width: 34em;
    padding: 12px 14px;
    background: #eaf3fc;
    border-radius: 14px;
    font-size: 16px;
    line-height: 1.7;
    text-align: left;
  }

  .pick-progress { margin: 0 0 8px; font-family: var(--en); font-weight: 700; font-size: 18px; color: var(--sub); }
  .done-title { margin: 0; font-size: 30px; font-weight: 800; }
  .done-sub { margin: 0 0 8px; font-size: 15px; color: var(--sub); }
  .done-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .done-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: var(--card);
    border: 2px solid var(--card-edge);
    border-radius: 999px;
    font: 700 17px var(--en);
    color: var(--ink);
    cursor: pointer;
  }
  .done-chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .stage.pop .big-pic { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(.6) rotate(-8deg); } 70% { transform: scale(1.12) rotate(3deg); } 100% { transform: scale(1); } }

  .btn {
    font: 800 16px var(--ja);
    color: var(--white);
    background: var(--pop);
    border: 0;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--pop-deep);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pop-deep); }
  .btn:disabled { opacity: .35; cursor: default; }
  .again { margin-top: 8px; }

  /* 絵の大きさは カードの はばから JS（fitPics）で px にして入れる。
     cqw は iPad Safari で さいしょの表示だけ ずれることがあったので つかわない */
  .cards { display: grid; grid-template-columns: repeat(4, var(--cell, minmax(0, 1fr))); justify-content: center; gap: 12px; --pic: 48px; --txt: 28px; }
  @media (max-width: 440px) { .cards { grid-template-columns: repeat(3, var(--cell, minmax(0, 1fr))); } }

  .main { display: grid; gap: 14px; }
  /* iPad よこむき: 大きいカードを ひだり、カードの ならびを みぎ。1がめんに おさめる */
  @media (min-width: 960px) and (orientation: landscape) {
    .wrap { max-width: 1140px; }
    .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); align-items: stretch; }
    .main:has(.cards[hidden]) { grid-template-columns: minmax(0, 1fr); }
    .cards { align-content: start; }
  }
  .card {
    background: var(--card);
    border: 3px solid var(--card-edge);
    border-radius: 20px;
    aspect-ratio: 1;
    max-width: 100%;
    font-size: max(32px, var(--pic));
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 0 5px 0 var(--card-edge);
    position: relative;
    padding: 0;
  }
  .card:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--card-edge); }
  .card[aria-pressed="true"] { background: var(--white); border-color: var(--pop); box-shadow: 0 5px 0 var(--pop); }
  .card.heard::after {
    content: "";
    position: absolute;
    top: 7px; right: 7px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--pop);
  }

  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  /* 不具合報告 */
  .report-open { margin-top: 6px; font: 800 13px var(--ja); color: var(--white); background: var(--sky-deep); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .report-open:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
  .report { border: 0; border-radius: 24px; padding: 0; width: min(480px, calc(100% - 32px)); color: var(--ink); background: var(--white); }
  .report::backdrop { background: rgba(28, 43, 64, .5); }
  .report-form { display: grid; gap: 12px; padding: 20px; }
  .report h2 { margin: 0; font-size: 22px; }
  .report-where { margin: 0; font-size: 14px; color: var(--sub); }
  .report-kinds { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .report-kinds legend { font-weight: 800; margin-bottom: 8px; padding: 0; }
  .report-kinds label { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px solid var(--card-edge); border-radius: 14px; background: var(--card); font-weight: 800; cursor: pointer; }
  .report-kinds label:has(input:checked) { border-color: var(--pop); background: var(--white); }
  .report-text-label { font-weight: 800; font-size: 15px; }
  .report textarea { font: 16px var(--ja); padding: 10px; border: 2px solid #d6e2ef; border-radius: 12px; resize: vertical; width: 100%; box-sizing: border-box; }
  .report-done { margin: 0; font-weight: 800; color: #1f8a4c; }
  .report-actions { display: flex; justify-content: space-between; gap: 12px; }
  .report-cancel { background: #8a9bb0; box-shadow: 0 4px 0 #6b7c91; }
  .pageinfo { color: var(--white); text-align: center; font-size: 14px; line-height: 1.5; }
  .pageinfo b { font-family: var(--en); font-size: 18px; }

  .tab:focus-visible, .btn:focus-visible, .card:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .stage.pop .big-pic { animation: none; } }
</style>

<div class="wrap">
  <header>
    <h1><a class="home" href="./">🏠 戻る</a>中国語</h1>
    <div class="modes" role="radiogroup" aria-label="モード">
      <button class="mode" type="button" role="radio" data-mode="listen">聞く</button>
      <button class="mode" type="button" role="radio" data-mode="quiz">テスト</button>
      <button class="mode" type="button" role="radio" data-mode="pick">選ぶ</button>
    </div>
  </header>
  <p class="hint" id="hint"></p>

  <nav class="tabs" id="tabs" role="tablist" aria-label="ページ"></nav>

  <div class="main">
  <section class="stage" id="stage" aria-live="polite">
    <div class="view" id="cardView">
      <div class="big-pic" id="pic"></div>
      <div class="big-word" id="word"></div>
      <div class="ja-row">
        <span class="big-ja" id="ja"></span>
        <button class="info" id="infoBtn" type="button" aria-expanded="false" aria-controls="note" hidden>i</button>
      </div>
      <p class="note" id="note" hidden></p>
      <button class="btn again" id="again" type="button">もう一回聞く</button>
    </div>
    <div class="view" id="pickView" hidden>
      <p class="pick-progress" id="pickProgress"></p>
      <div class="choices" id="choices"></div>
      <p class="pick-msg" id="pickMsg"></p>
      <button class="btn" id="replay" type="button">🔊 聞く</button>
    </div>
    <div class="view" id="doneView" hidden>
      <p class="done-title">終わり！</p>
      <p class="done-sub">聞いた言葉。押すと、もう一回聞けるよ</p>
      <div class="done-list" id="doneList"></div>
      <button class="btn" id="restart" type="button">もう一回</button>
    </div>
  </section>

  <div class="cards" id="cards"></div>
  </div>

  <div class="pager">
    <button class="btn" id="prev" type="button">← 前</button>
    <div class="pageinfo">
      <div><b id="pno">1</b> / <b id="pmax">10</b> ページ</div>
      <div>聞いたカード <b id="n">0</b> / <b id="total">0</b></div>
      <button class="report-open" id="reportOpen" type="button">📮 お父さんに知らせる</button>
    </div>
    <button class="btn" id="next" type="button">次 →</button>
  </div>
</div>

<!-- 娘からの不具合報告。この端末の中だけに残し、ホーム画面の親の記録で見る -->
<dialog class="report" id="report" aria-labelledby="reportTitle">
  <form class="report-form" id="reportForm" method="dialog">
    <h2 id="reportTitle">お父さんに知らせる</h2>
    <p class="report-where" id="reportWhere"></p>
    <fieldset class="report-kinds">
      <legend>どうしたの？</legend>
      <label><input type="radio" name="kind" value="動かない" id="kindBroken"> 動かない</label>
      <label><input type="radio" name="kind" value="音がへん" id="kindSound"> 音がへん</label>
      <label><input type="radio" name="kind" value="まちがってる" id="kindWrong"> まちがってる</label>
      <label><input type="radio" name="kind" value="こうしてほしい" id="kindWish"> こうしてほしい</label>
    </fieldset>
    <label class="report-text-label" for="reportText">くわしく（書かなくてもいいよ）</label>
    <textarea id="reportText" rows="3"></textarea>
    <p class="report-done" id="reportDone" hidden>受けつけました！ お父さんが あとで見るよ。ありがとう！</p>
    <div class="report-actions">
      <button class="btn report-cancel" id="reportCancel" type="button">やめる</button>
      <button class="btn" id="reportSend" type="button">知らせる</button>
    </div>
  </form>
</dialog>

const HINTS = {"listen": "カードを押すと、中国語でしゃべるよ", "quiz": "中国語で何て言う？ 言えたら「答え」を押してね", "pick": "音を聞いて、合っている絵を選んでね"};
const NOTES = {"妈": "中国語は、音の高さ（声調）で意味が変わるよ。mā は高く平ら、má は上がる、mǎ は下がって上がる、mà は下がる。ma の音だけで お母さん・あさ・馬・しかる になるんだ。", "是": "shī・shí・shǐ・shì も、音の高さだけで 詩・10・使う・〜です に変わるよ。", "你好": "你（あなた）＋ 好（よい）で「こんにちは」。朝でも夜でも使えるよ。", "谢谢": "谢 は日本の「謝」と同じ字。中国では 字を簡単にした「簡体字」を使うことが多いよ（谢＝謝）。", "好吃": "好（よい）＋ 吃（食べる）で「おいしい」。漢字が同じでも、日本語と意味がちがう字があるよ。", "加油": "字は「油を加える」。がんばれ！ と応援するときに使うよ。", "一": "数字の漢字は 日本と同じ！ 読み方がちがうだけ。一・七・八は、日本語の いち・しち・はち と少し似ているね。", "饺子": "日本語の「ギョーザ」は、中国語の jiǎo zi から来た言葉と言われているよ。", "奶奶": "お父さんのお母さんは 奶奶（nǎi nai）、お母さんのお母さんは 姥姥（lǎo lao）と、言い方が分かれるよ。", "饿了": "最後の 了（le）は「〜になった」の感じ。饿（おなかがすく）＋ 了 で「おなかすいた」。困了・累了 も同じ形だよ。"};
const PICK_SHOWS_WORD = true;

</script>
<script>
  const $ = (id) => document.getElementById(id);
  const heard = new Set();
  let page = 0;
  let current = 0;

  // ぶんは入れかえる語を {} でかこんでいる。音と表示では外す
  const plain = (s) => s.replace(/[{}]/g, "");

  // 音は1つの Audio を使い回す（iPad は、タップで一度鳴らした Audio でないと あとから鳴らせないため）。
  // 切りかえるときは load() で前の音を捨ててから鳴らす
  const player = new Audio();
  player.preload = "auto";
  function say(word) {
    player.pause();
    player.src = AUDIO[plain(word)];
    player.load();
    return player.play().catch(() => {});
  }

  // いま鳴っている音が終わるまで待つ（最長 max ミリ秒）
  function afterSound(max) {
    return new Promise((resolve) => {
      if (player.paused || player.ended) return resolve();
      const t = setTimeout(resolve, max);
      player.addEventListener("ended", () => { clearTimeout(t); resolve(); }, { once: true });
    });
  }

  // 絵文字でなく文字そのもの（数字・アルファベット）のカードは英字フォントで出す
  // 中国語の声調カード（mā など）も文字カード。À〜ɏ は声調記号つきのローマ字
  const isText = (pic) => /^[\x20-\x7eÀ-ɏ㄰-㆏가-힣]+$/.test(pic);

  let mode = "listen";
  let revealed = true;
  try {
    const saved = localStorage.getItem("eigo-mode");
    if (saved === "quiz" || saved === "pick") mode = saved;
  } catch (e) {}

  // 「聞いたカード」は、どのモードでも そのカードの音を聞いたら数える（聞く・テストの答え・選ぶの正解）。
  // アプリを閉じても消えないよう端末に残す。キーは ページ名＋語（並びが変わってもずれない）
  const heardKey = (p, i) => PAGES[p].title + ":" + plain(PAGES[p].words[i][1]);
  function markHeard(i) {
    heard.add(heardKey(page, i));
    try { localStorage.setItem("eigo-heard-" + APP_ID, JSON.stringify([...heard])); } catch (e) {}
    $("cards").children[i].classList.add("heard");
    $("n").textContent = heard.size;
  }

  function renderWord() {
    const word = PAGES[page].words[current][1];
    const w = $("word");
    w.textContent = "";
    w.classList.toggle("long", [...plain(word)].reduce((n, c) => n + (c.charCodeAt(0) > 0x2e80 ? 2 : 1), 0) > 10);
    // テストでは入れかえる語だけ伏せる。わくの文は見えたまま、くりかえし言えるように
    const hasSlot = word.includes("{");
    w.classList.toggle("hidden", !revealed && !hasSlot);
    if (!revealed && !hasSlot) {
      w.textContent = "？？？";
    } else {
      word.split(/(\{[^}]*\})/).forEach((part) => {
        if (!part) return;
        if (part.startsWith("{")) {
          const s = document.createElement("span");
          s.className = "slot" + (revealed ? "" : " masked");
          s.textContent = revealed ? part.slice(1, -1) : "？？？";
          w.appendChild(s);
        } else {
          w.appendChild(document.createTextNode(part));
        }
      });
    }
    $("again").textContent = revealed ? "もう一回聞く" : "答え";
    // 韓国語の読み（カタカナ）は答えそのもの。テストで伏せているあいだは意味だけ出す
    const [, , ja, reading] = PAGES[page].words[current];
    $("ja").textContent = revealed && reading && reading !== ja ? `${reading}（${ja}）` : ja;
    // ⓘ は英語が見えてから。テストの答えを先に見せない
    const note = NOTES[plain(word)];
    $("infoBtn").hidden = !(revealed && note);
    $("infoBtn").setAttribute("aria-expanded", "false");
    $("note").hidden = true;
    $("note").textContent = note || "";
  }

  // 親だけが見る きろく。端末の中だけに置き、どこにも送らない。ホーム画面のタイトル長押しで見る
  const APP_ID = location.pathname.split("/").pop().replace(".html", "") || document.title;

  // 前に聞いたカードを読みこむ。いまのカードに無いもの（ページ名が変わった等）は数えない
  try {
    const valid = new Set(PAGES.flatMap((pg, p) => pg.words.map((_, i) => heardKey(p, i))));
    JSON.parse(localStorage.getItem("eigo-heard-" + APP_ID) || "[]").forEach((k) => valid.has(k) && heard.add(k));
  } catch (e) {}
  function logEvent(kind) {
    try {
      const all = JSON.parse(localStorage.getItem("eigo-log") || "{}");
      const now = new Date();
      const day = now.toLocaleDateString("sv-SE");
      const d = (all[day] ||= { first: now.toTimeString().slice(0, 5), apps: {} });
      const a = (d.apps[APP_ID] ||= { open: 0, tap: 0, round: 0, pages: {} });
      a[kind] += 1;
      if (kind !== "open") {
        const t = PAGES[page].title;
        a.pages[t] = (a.pages[t] || 0) + 1;
      }
      localStorage.setItem("eigo-log", JSON.stringify(all));
    } catch (e) {}
  }

  // カード1まいの大きさと、絵・文字の大きさを きめる。画面の向きや大きさが かわるたびに 計算しなおす。
  // iPad など広い画面では、下の「前・次」まで1画面に収まるように、たての長さでも小さくする
  // （Safari はアドレスバーのぶん たてが短く、下のボタンが切れていた）
  function fitPics() {
    const cards = $("cards");
    const w = cards.clientWidth;
    if (!w) return;
    const cols = getComputedStyle(cards).gridTemplateColumns.split(" ").length;
    const byWidth = (w - 12 * (cols - 1)) / cols;
    let size = byWidth;
    if (innerWidth >= 700) {
      const rows = Math.ceil(cards.children.length / cols);
      const top = cards.getBoundingClientRect().top + scrollY;
      const below = document.querySelector(".pager").offsetHeight + 14 + 32 + 12;
      const byHeight = (innerHeight - top - below - 12 * (rows - 1)) / rows;
      size = Math.max(64, Math.min(byWidth, byHeight));
    }
    if (size < byWidth - 0.5) cards.style.setProperty("--cell", Math.floor(size) + "px");
    else cards.style.removeProperty("--cell");
    cards.style.setProperty("--pic", Math.round(size * 0.44) + "px");
    cards.style.setProperty("--txt", Math.round(size * 0.26) + "px");
  }
  if ("ResizeObserver" in window) new ResizeObserver(fitPics).observe($("cards"));
  addEventListener("resize", fitPics);

  // 絵の下に小さく文字を添える。text が無ければ絵だけ
  function fillPic(btn, pic, text, cls = "") {
    btn.textContent = pic;
    if (!text) return;
    const cap = document.createElement("span");
    cap.className = "cap" + (cls ? " " + cls : "");
    cap.textContent = text;
    btn.appendChild(cap);
  }

  function showWord(i, tapped) {
    current = i;
    const [pic, word] = PAGES[page].words[i];
    const p = $("pic");
    p.textContent = pic;
    p.classList.toggle("txt", isText(pic));
    // テストでは英語を伏せて、こたえボタンで出す
    revealed = mode === "listen" || !tapped;
    renderWord();
    const stage = $("stage");
    stage.classList.remove("pop");
    void stage.offsetWidth;
    stage.classList.add("pop");
    document.querySelectorAll(".card").forEach((c, j) => c.setAttribute("aria-pressed", j === i));
    if (tapped) logEvent("tap");
    if (tapped && mode === "listen") {
      markHeard(i);
      say(word);
    }
  }

  // えらぶ: 音だけ流して、同じページの4まいから当てる。10もんで おわり。
  // 点数は出さない。おわりの画面は「きいたことば」だけ
  const ROUND = 10;
  let queue = [];
  let qNo = 0;
  let answer = -1;
  let locked = false;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startRound(speak) {
    const n = PAGES[page].words.length;
    queue = shuffle([...Array(n).keys()]).slice(0, Math.min(ROUND, n));
    qNo = 0;
    $("doneView").hidden = true;
    $("pickView").hidden = false;
    newQuestion(speak);
  }

  function finishRound() {
    const words = PAGES[page].words;
    const list = $("doneList");
    list.textContent = "";
    queue.forEach((i) => {
      const [pic, word] = words[i];
      const b = document.createElement("button");
      b.type = "button";
      b.className = "done-chip";
      b.textContent = pic + " " + plain(word);
      b.addEventListener("click", () => say(word));
      list.appendChild(b);
    });
    $("pickView").hidden = true;
    $("doneView").hidden = false;
    logEvent("round");
  }

  function newQuestion(speak) {
    const words = PAGES[page].words;
    answer = queue[qNo];
    $("pickProgress").textContent = `${qNo + 1} / ${queue.length}`;
    const others = shuffle(words.map((_, i) => i).filter((i) => i !== answer)).slice(0, 3);
    const box = $("choices");
    box.textContent = "";
    shuffle([answer, ...others]).forEach((i) => {
      const pic = words[i][0];
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice" + (isText(pic) ? " txt" : "");
      // 韓国語は ハングルを添える（カタカナの読みは答えそのものなので出さない）
      if (PICK_SHOWS_WORD) fillPic(b, pic, plain(words[i][1]), "word");
      else fillPic(b, pic, PAGES[page].labels ? words[i][2] : "");
      b.setAttribute("aria-label", words[i][2]);
      b.addEventListener("click", () => choose(b, i));
      box.appendChild(b);
    });
    $("pickMsg").textContent = speak ? "何かな？" : "「🔊 聞く」を押してね";
    locked = false;
    if (speak) say(words[answer][1]);
  }

  function choose(btn, i) {
    if (locked || btn.classList.contains("wrong")) return;
    const word = PAGES[page].words[answer][1];
    if (i === answer) {
      locked = true;
      logEvent("tap");
      markHeard(answer);
      btn.classList.add("right");
      const msg = $("pickMsg");
      msg.textContent = "正解！ ";
      const en = document.createElement("span");
      en.className = "en";
      en.textContent = plain(word);
      msg.appendChild(en);
      const round = queue;
      // 正解の音を 最後まで聞いてから 次の問題へ（長い文だと 次の音が かぶっていた）
      say(word)
        .then(() => afterSound(4000))
        .then(() => new Promise((r) => setTimeout(r, 700)))
        .then(() => {
          // とちゅうで ページや モードが かわっていたら なにもしない
          if (mode !== "pick" || queue !== round) return;
          qNo += 1;
          if (qNo < queue.length) newQuestion(true);
          else finishRound();
        });
    } else {
      btn.classList.add("wrong");
      $("pickMsg").textContent = "ちがうよ。もう一回聞いてみよう";
    }
  }


  function setMode(m, speak) {
    mode = m;
    try { localStorage.setItem("eigo-mode", m); } catch (e) {}
    document.querySelectorAll(".mode").forEach((b) => b.setAttribute("aria-checked", b.dataset.mode === m));
    $("hint").textContent = HINTS[m];
    $("cardView").hidden = m === "pick";
    $("cards").hidden = m === "pick";
    $("pickView").hidden = m !== "pick";
    $("doneView").hidden = true;
    if (m === "pick") {
      startRound(speak);
    } else {
      revealed = true;
      renderWord();
    }
  }

  function showPage(p, speak) {
    page = p;
    const cards = $("cards");
    cards.textContent = "";
    PAGES[p].words.forEach(([pic, word, ja], i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "card" + (heard.has(heardKey(p, i)) ? " heard" : "") + (isText(pic) ? " txt" : "");
      fillPic(b, pic, PAGES[p].labels ? ja : "");
      b.setAttribute("aria-label", word);
      b.addEventListener("click", () => showWord(i, true));
      cards.appendChild(b);
    });
    fitPics();
    document.querySelectorAll(".tab").forEach((t, j) => t.setAttribute("aria-selected", j === p));
    const active = $("tabs").children[p];
    active.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
    $("pno").textContent = p + 1;
    $("prev").disabled = p === 0;
    $("next").disabled = p === PAGES.length - 1;
    showWord(0, false);
    if (mode === "pick") startRound(speak);
  }

  PAGES.forEach((pg, i) => {
    const t = document.createElement("button");
    t.type = "button";
    t.className = "tab";
    t.setAttribute("role", "tab");
    t.innerHTML = '<span class="num"></span><span class="name"></span>';
    t.querySelector(".num").textContent = i + 1;
    t.querySelector(".name").textContent = pg.title;
    t.addEventListener("click", () => showPage(i, true));
    $("tabs").appendChild(t);
  });
  $("pmax").textContent = PAGES.length;
  $("total").textContent = PAGES.reduce((s, pg) => s + pg.words.length, 0);
  $("n").textContent = heard.size;
  $("again").addEventListener("click", () => {
    if (!revealed) {
      revealed = true;
      renderWord();
      markHeard(current);
    }
    say(PAGES[page].words[current][1]);
  });
  $("replay").addEventListener("click", () => say(PAGES[page].words[answer][1]));
  $("restart").addEventListener("click", () => startRound(true));
  $("infoBtn").addEventListener("click", () => {
    const open = $("note").hidden;
    $("note").hidden = !open;
    $("infoBtn").setAttribute("aria-expanded", String(open));
  });
  document.querySelectorAll(".mode").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode, true)));

  // 不具合報告: いまどのアプリ・ページ・カードにいたかを 自動で添えて、端末の中にためる
  function reportContext() {
    const words = PAGES[page].words;
    const i = mode === "pick" ? answer : current;
    const card = words[i] ? plain(words[i][1]) : "";
    return { app: APP_ID, appTitle: document.title, page: PAGES[page].title, card, mode };
  }
  const MODE_NAMES = { listen: "聞く", quiz: "テスト", pick: "選ぶ" };
  $("reportOpen").addEventListener("click", () => {
    const c = reportContext();
    $("reportWhere").textContent = `${c.appTitle} ・ ${c.page} ・ ${c.card}（${MODE_NAMES[c.mode]}）`;
    $("reportForm").reset();
    $("reportDone").hidden = true;
    $("reportSend").disabled = false;
    $("report").showModal();
  });
  $("reportCancel").addEventListener("click", () => $("report").close());
  $("reportSend").addEventListener("click", () => {
    const kind = ($("reportForm").querySelector("input[name=kind]:checked") || {}).value || "";
    const text = $("reportText").value.trim();
    if (!kind && !text) {
      $("reportWhere").textContent = "どれか選ぶか、書いてね";
      return;
    }
    const r = { at: new Date().toLocaleString("sv-SE").slice(0, 16), ...reportContext(), kind, text, screen: `${innerWidth}x${innerHeight}` };
    // まず端末に残す（共有をやめても、ホーム画面の親の記録で見られるように）
    try {
      const all = JSON.parse(localStorage.getItem("eigo-reports") || "[]");
      all.push(r);
      localStorage.setItem("eigo-reports", JSON.stringify(all));
    } catch (e) {}
    $("reportSend").disabled = true;
    const done = (msg) => {
      $("reportDone").textContent = msg;
      $("reportDone").hidden = false;
      setTimeout(() => $("report").close(), 1800);
    };
    // iPad の共有メニューで、娘が自分でメッセージや LINE を選んでお父さんに送る。
    // あて先はコードに書かない（公開リポジトリなので）
    if (navigator.share) {
      const body = [
        "📮 えいごアプリから",
        `【${r.kind || "お知らせ"}】${r.text}`,
        `場所：${r.appTitle} / ${r.page} / ${r.card}（${MODE_NAMES[r.mode]}）`,
        r.at,
      ].join("\n");
      navigator.share({ text: body })
        .then(() => done("送れたよ！ ありがとう！"))
        .catch(() => done("送らなかったけど、iPad には残したよ。"));
    } else {
      done("受けつけました！ お父さんが あとで見るよ。ありがとう！");
    }
  });
  $("prev").addEventListener("click", () => page > 0 && showPage(page - 1, true));
  $("next").addEventListener("click", () => page < PAGES.length - 1 && showPage(page + 1, true));
  // 音はタップのあとでないと鳴らないので、開いた直後の1問目は「もう一回きく」で流す
  setMode(mode, false);
  showPage(0, false);
  fitPics();
  logEvent("open");
</script>

<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
