<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="えいご">
<meta name="theme-color" content="#2f7fd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>えいご</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root {
    --sky: #2f7fd6;
    --sky-deep: #1d5ea8;
    --card: #fff6cf;
    --card-edge: #e9c94a;
    --ink: #1c2b40;
    --white: #ffffff;
    --en: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
    --ja: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--sky);
  }
  body {
    margin: 0;
    background: var(--sky);
    color: var(--white);
    font-family: var(--ja);
    padding-inline: 16px;
    padding-block: 32px;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: clamp(30px, 8vw, 44px); font-weight: 800; letter-spacing: .04em; }
  .apps { display: grid; gap: 16px; }
  .app {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 16px;
    padding: 20px;
    background: var(--card);
    border: 3px solid var(--card-edge);
    border-radius: 24px;
    box-shadow: 0 6px 0 var(--card-edge);
    color: var(--ink);
    text-decoration: none;
  }
  .app:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--card-edge); }
  .app:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  .app .pic { font-size: 56px; line-height: 1; }
  .app .name { font-size: 24px; font-weight: 800; }
  .app .sub { font-family: var(--en); font-size: 17px; color: #5a6b82; }
  .status { margin: 0; font-size: 14px; opacity: .9; min-height: 1.5em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>えいご</h1>
  <div class="apps">
    <a class="app" href="words.html">
      <span class="pic">🐱</span>
      <span><span class="name">えいごカード</span><br><span class="sub">cat, dog, apple ...</span></span>
    </a>
    <a class="app" href="phrases.html">
      <span class="pic">💬</span>
      <span><span class="name">えいごでいおう</span><br><span class="sub">I like cats.</span></span>
    </a>
  </div>
  <p class="status" id="status"></p>
</div>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => {
      document.getElementById("status").textContent = "インターネットがなくても つかえます";
    }).catch(() => {});
  }
</script>
</body>
</html>
