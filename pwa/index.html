<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="えいご">
<meta name="theme-color" content="#2f7fd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>えいご</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root {
    --sky: #2f7fd6;
    --sky-deep: #1d5ea8;
    --card: #fff6cf;
    --card-edge: #e9c94a;
    --ink: #1c2b40;
    --white: #ffffff;
    --en: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
    --ja: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--sky);
  }
  body {
    margin: 0;
    background: var(--sky);
    color: var(--white);
    font-family: var(--ja);
    padding-inline: 16px;
    padding-block: 32px;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: clamp(30px, 8vw, 44px); font-weight: 800; letter-spacing: .04em; }
  .apps { display: grid; gap: 16px; }
  .app {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 16px;
    padding: 20px;
    background: var(--card);
    border: 3px solid var(--card-edge);
    border-radius: 24px;
    box-shadow: 0 6px 0 var(--card-edge);
    color: var(--ink);
    text-decoration: none;
  }
  .app:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--card-edge); }
  .app:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  .app .pic { font-size: 56px; line-height: 1; }
  .app .name { font-size: 24px; font-weight: 800; }
  .app .sub { font-family: var(--en); font-size: 17px; color: #5a6b82; }
  .status { margin: 0; font-size: 14px; opacity: .9; min-height: 1.5em; }
  h1 { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  [hidden] { display: none !important; }

  /* おやの きろく。タイトル長押しで出る */
  .log { background: var(--white); color: var(--ink); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
  .log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .log h2 { margin: 0; font-size: 18px; }
  .log-note { margin: 0; font-size: 13px; color: #5a6b82; }
  .log-close { font: 800 14px var(--ja); border: 0; border-radius: 999px; padding: 6px 14px; background: var(--sky); color: var(--white); cursor: pointer; }
  .log-table-wrap { overflow-x: auto; }
  .log table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  .log th, .log td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e3ebf4; vertical-align: top; }
  .log th { font-size: 12px; color: #5a6b82; font-weight: 800; white-space: nowrap; }
  .log td.num { text-align: right; white-space: nowrap; }
  .log .pages { font-size: 13px; color: #5a6b82; }
  .log-empty { margin: 0; font-size: 14px; }
  .reports { margin: 0; padding-left: 1.4em; display: grid; gap: 10px; font-size: 14px; }
  .reports .meta { color: #5a6b82; font-size: 12px; font-variant-numeric: tabular-nums; }
  .reports .kind { font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <h1>えいご</h1>
  <div class="apps">
    <a class="app" href="words.html">
      <span class="pic">🐱</span>
      <span><span class="name">英語カード</span><br><span class="sub">cat, dog, apple ...</span></span>
    </a>
    <a class="app" href="phrases.html">
      <span class="pic">💬</span>
      <span><span class="name">英語で言おう</span><br><span class="sub">I like cats.</span></span>
    </a>
    <a class="app" href="korean.html">
      <span class="pic">🇰🇷</span>
      <span><span class="name">韓国語</span><br><span class="sub">안녕하세요</span></span>
    </a>
    <a class="app" href="chinese.html">
      <span class="pic">🇨🇳</span>
      <span><span class="name">中国語</span><br><span class="sub">你好 nǐ hǎo</span></span>
    </a>
    <a class="app" href="thai.html">
      <span class="pic">🇹🇭</span>
      <span><span class="name">タイ語</span><br><span class="sub">สวัสดี サワッディー</span></span>
    </a>
    <a class="app" href="vietnamese.html">
      <span class="pic">🇻🇳</span>
      <span><span class="name">ベトナム語</span><br><span class="sub">Xin chào</span></span>
    </a>
  </div>
  <p class="status" id="status"></p>

  <section class="log" id="log" hidden aria-label="つかったきろく">
    <div class="log-head">
      <h2>つかったきろく</h2>
      <button class="log-close" id="logClose" type="button">とじる</button>
    </div>
    <p class="log-note">このiPadの中だけに ある きろくです。どこにも おくっていません。</p>
    <div id="logBody"></div>

    <div class="log-head">
      <h2>娘からのお知らせ</h2>
      <button class="log-close" id="reportsCopy" type="button">コピー</button>
    </div>
    <p class="log-note" id="reportsNote">アプリの「📮 お父さんに知らせる」から届いたもの。コピーして Claude に貼れば直せます。</p>
    <ol class="reports" id="reportsBody"></ol>
  </section>
</div>
<script>
  // おやの きろく: タイトルを 2びょう ながおしで ひらく
  const APP_NAMES = { words: "カード", phrases: "ぶん", korean: "韓国", chinese: "中国", thai: "タイ", vietnamese: "ベトナム" };

  // 娘からの不具合報告（アプリ側で localStorage の eigo-reports にためている）
  function loadReports() {
    try { return JSON.parse(localStorage.getItem("eigo-reports") || "[]"); } catch (e) { return []; }
  }
  const reportLine = (r) =>
    `${r.at} ${r.appTitle} / ${r.page} / ${r.card}（${r.mode}） ${r.kind}${r.text ? "：" + r.text : ""} [${r.screen}]`;

  function renderReports() {
    const list = document.getElementById("reportsBody");
    list.textContent = "";
    const reports = loadReports().slice().reverse();
    if (!reports.length) {
      const li = document.createElement("li");
      li.textContent = "まだありません。";
      list.appendChild(li);
      return;
    }
    reports.forEach((r) => {
      const li = document.createElement("li");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${r.at} ・ ${r.appTitle} / ${r.page} / ${r.card}`;
      const body = document.createElement("div");
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = r.kind || "（選択なし）";
      body.appendChild(kind);
      if (r.text) body.appendChild(document.createTextNode("：" + r.text));
      li.append(meta, body);
      list.appendChild(li);
    });
  }

  document.getElementById("reportsCopy").addEventListener("click", () => {
    const text = loadReports().map(reportLine).join("\n") || "（お知らせなし）";
    const note = document.getElementById("reportsNote");
    navigator.clipboard.writeText(text)
      .then(() => { note.textContent = `${loadReports().length}件をコピーしました。Claude に貼ってください。`; })
      .catch(() => { note.textContent = "コピーできませんでした。下の一覧を長押しで選んでコピーしてください。"; });
  });

  function renderLog() {
    const body = document.getElementById("logBody");
    body.textContent = "";
    let all = {};
    try { all = JSON.parse(localStorage.getItem("eigo-log") || "{}"); } catch (e) {}
    const days = Object.keys(all).sort().reverse().slice(0, 14);
    if (!days.length) {
      const p = document.createElement("p");
      p.className = "log-empty";
      p.textContent = "まだ きろくが ありません。";
      body.appendChild(p);
      return;
    }
    const wrap = document.createElement("div");
    wrap.className = "log-table-wrap";
    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>ひ</th><th>さいしょ</th><th>ひらいた</th><th>おした</th><th>えらぶ</th><th>ページ</th></tr></thead>";
    const tbody = document.createElement("tbody");
    days.forEach((day) => {
      const d = all[day];
      const apps = Object.entries(d.apps || {});
      const opens = apps.map(([id, a]) => `${APP_NAMES[id] || id} ${a.open}`).join(" / ");
      const taps = apps.reduce((s, [, a]) => s + a.tap, 0);
      const rounds = apps.reduce((s, [, a]) => s + a.round, 0);
      const pages = apps.flatMap(([, a]) => Object.entries(a.pages))
        .sort((x, y) => y[1] - x[1]).slice(0, 4).map(([t, n]) => `${t} ${n}`).join("、");
      const tr = document.createElement("tr");
      [day.slice(5), d.first || "", opens, taps, rounds ? `${rounds}かい` : "", pages].forEach((v, i) => {
        const td = document.createElement("td");
        td.textContent = v;
        if (i === 3 || i === 4) td.className = "num";
        if (i === 5) td.className = "pages";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    body.appendChild(wrap);
  }

  const title = document.querySelector("h1");
  let pressTimer = null;
  const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; };
  title.addEventListener("pointerdown", () => {
    cancelPress();
    pressTimer = setTimeout(() => {
      renderLog();
      renderReports();
      document.getElementById("log").hidden = false;
    }, 2000);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((e) => title.addEventListener(e, cancelPress));
  title.addEventListener("contextmenu", (e) => e.preventDefault());
  document.getElementById("logClose").addEventListener("click", () => {
    document.getElementById("log").hidden = true;
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => {
      document.getElementById("status").textContent = "インターネットがなくても使えます";
    }).catch(() => {});
  }
</script>
</body>
</html>
