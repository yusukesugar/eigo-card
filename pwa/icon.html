<!doctype html>
<!-- アイコンの元。build では使わない。作り直すときは README の手順で PNG にする -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: #2f7fd6; overflow: hidden; }
  .card {
    position: absolute; left: 76px; top: 96px; width: 360px; height: 300px;
    background: #fff6cf; border: 10px solid #e9c94a; border-radius: 56px; box-sizing: border-box;
    box-shadow: 0 18px 0 #1d5ea8;
    display: grid; place-items: center;
    font: 700 128px "Fredoka", sans-serif; color: #1c2b40; letter-spacing: 2px;
  }
  .dot { position: absolute; right: 22px; top: 20px; width: 28px; height: 28px; border-radius: 50%; background: #ff6b4a; }
</style>
</head>
<body><div class="card">ABC<span class="dot"></span></div></body>
</html>
